# A release of main, made on every push to it, or by hand: Actions > Release
# > Run workflow. It raises the version as the commits since the previous
# release ask, builds the Linux, Windows and macOS packages at it
# (build.yml), then commits that version to main with those commits in
# CHANGELOG.md, tags the commit and publishes the packages as the latest
# release, with the same changes in its notes. See docs/packaging.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Part of the version to raise: auto, as the commits ask, or from 0.3.0 to 0.3.1 (patch), 0.4.0 (minor) or 1.0.0 (major)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

# One release at a time; pushes meanwhile wait, and the newest of them
# releases everything that came.
concurrency:
  group: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      previous: ${{ steps.version.outputs.previous }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # A push asks for auto.
      BUMP: ${{ inputs.bump || 'auto' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # The previous release's tag, or the commit that set the current
          # version, below.
          fetch-depth: 0
      - id: version
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor patch <<< "${current%%-*}"
          # The changes since the latest release, or, before this repository
          # has one, since the commit that set the version it raises.
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName // empty')
          if [ -z "$previous" ]; then
            previous=$(git log -1 --format=%H -G '^version = "' -- Cargo.toml)
          fi
          # Merges are left out, as the notes leave them out, and so are the
          # release commits, which the workflow's own pushes make.
          subjects=$(git log --no-merges --format=%s "$previous..HEAD" | grep -v '^chore(release): ' || true)
          if [ -z "$subjects" ]; then
            echo "Nothing new on main since $previous"
            exit 0
          fi
          if [ "$BUMP" = auto ]; then
            # As Conventional Commits ask: a breaking change raises the
            # major version, or the minor one before 1.0, a feature the
            # minor one, anything else the patch.
            if grep -qE '^[a-z]+(\([^)]*\))?!: ' <<< "$subjects" \
              || git log --no-merges --format=%b "$previous..HEAD" | grep -qE '^BREAKING[ -]CHANGE: '; then
              BUMP=$([ "$major" = 0 ] && echo minor || echo major)
            elif grep -qE '^feat(\([^)]*\))?: ' <<< "$subjects"; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi
          case $BUMP in
            major) version=$((major + 1)).0.0 ;;
            minor) version=$major.$((minor + 1)).0 ;;
            patch) version=$major.$minor.$((patch + 1)) ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged" >&2
            exit 1
          fi
          echo "Releasing $version ($BUMP), raised from $current, with the changes since $previous"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # Nothing to release when no commit came but the release's own.
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      commit: ${{ needs.version.outputs.commit }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: .github/scripts/collect-release dist release
      - name: Write the changes
        run: |
          # A tag is named as it is; a commit by its short hash.
          since=$PREVIOUS
          if [[ $PREVIOUS =~ ^[0-9a-f]{40}$ ]]; then
            since=${PREVIOUS:0:7}
          fi
          .github/scripts/change-list "$PREVIOUS" "$COMMIT" > changes.md
          {
            echo "## Changes since $since"
            echo
            cat changes.md
            echo
            echo "## Downloads"
            echo
            echo "- Linux: the AppImage, or on Arch Linux the .pkg.tar.zst, installed with \`sudo pacman -U\` and its link."
            echo "- Windows 10/11: the setup .exe, or the portable ZIP."
            echo "- macOS 11 or later on Apple silicon: the .dmg. It's signed ad hoc and not notarized, so open Yapfast.app the first time with Control-click, Open."
            echo
            echo "SHA256SUMS.txt holds each file's SHA-256."
          } > notes.md
          {
            echo "# Changelog"
            echo
            echo "Each release's changes since the one before, as its release notes list them."
            echo
            echo "## $VERSION ($(date -u +%F))"
            echo
            # One level down, under the release's heading.
            sed 's/^### /#### /' changes.md
            # The earlier releases, below the four lines of heading above.
            if [ -f CHANGELOG.md ]; then
              echo
              tail -n +5 CHANGELOG.md
            fi
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
      - name: Commit and tag the version
        run: |
          scripts/set-version "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md packaging
          git commit --message "chore(release): $VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          # Commits that reached main during the build come before the
          # release's: a merge keeps the tagged commit in main's history.
          # Pushes with the workflow's token start no workflow, so this one
          # releases nothing again; the pushes that brought those commits
          # each started a release, which releases them next.
          if ! git push origin HEAD:main; then
            git fetch origin main
            git merge --no-edit FETCH_HEAD
            git push origin HEAD:main
          fi
      - name: Publish
        run: |
          gh release create "v$VERSION" release/* --verify-tag --latest \
            --title "Yapfast $VERSION" --notes-file notes.md
