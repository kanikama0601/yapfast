# Builds the Discord release of one commit at one version for Linux, Windows
# and macOS, for nightly.yml and release.yml, which publish what it uploads:
# the artifacts linux, windows, windows-installer, macos-arm64 and
# macos-x86_64. See docs/packaging.md.
name: Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      commit:
        type: string
        required: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          # Nix refuses a shallow Git repository as a flake.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - run: scripts/set-version "${{ inputs.version }}"
      # A fresh runner installs Rust and fetches the crates for longer than
      # scripts/package-linux.py gives cargo metadata.
      - name: Fetch the toolchain and crates
        run: nix develop path:./nix --command cargo fetch --locked
      - run: scripts/build-appimage
      # The AppImage's binary as an Arch package, in an Arch container.
      - run: scripts/package-arch
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/dist/linux/Yapfast-*
            target/dist/linux/yapfast-*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # Skia built for Windows, and the MSVC CRT and SDK it was built against,
      # which nix/prepare-windows-skia.py checks before reusing it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            .local/windows/skia-static-production/build.json
            .local/windows/skia-static-production/prepared
          key: windows-skia-${{ hashFiles('nix/flake.lock', 'nix/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/**') }}
      # The compiled dependencies. Before scripts/set-version, which changes
      # Cargo.lock, so the key changes only with the dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/set-version "${{ inputs.version }}"
      # Wine doesn't start on the runner (kernel32.dll, c0000135), so the
      # windows-installer job makes the installer on Windows itself.
      - run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/discord/Yapfast-*
          if-no-files-found: error
          compression-level: 0

  # The installer of the windows job's ZIP, compiled by the Inno Setup that
  # scripts/package-windows.py pins, with the same definitions it passes.
  windows-installer:
    needs: windows
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          sparse-checkout: |
            packaging
            scripts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Compile the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = python -c "import runpy, sys; sys.path.insert(0, 'scripts'); g = runpy.run_path('scripts/package-windows.py'); print(g['INNO_SETUP_URL']); print(g['INNO_SETUP_SHA256'])"
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $pin[0] -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $pin[1].ToUpper()) { throw "$($pin[0]) doesn't match its pinned SHA-256" }
          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', '/DIR=C:\InnoSetup', '/NOICONS'
          $package = Join-Path $env:RUNNER_TEMP 'package'
          Expand-Archive "dist/Yapfast-$env:VERSION-windows-x64.zip" -DestinationPath $package
          $out = Join-Path $env:RUNNER_TEMP 'installer'
          # The file's version resource takes only numbers, without a nightly's suffix.
          & C:\InnoSetup\ISCC.exe /Q "/DAppVersion=$env:VERSION" "/DVersionNumber=$($env:VERSION.Split('-')[0])" `
            "/DSourceDir=$package\Yapfast-$env:VERSION-windows-x64" "/DLicenseFile=$package\Yapfast-$env:VERSION-windows-x64\LICENSE.txt" `
            "/O$out" packaging\windows\yapfast.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
          Get-ChildItem $out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ runner.temp }}/installer/Yapfast-*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  # The notices of Skia's third-party code for the macOS package, from the
  # pinned Skia source the Linux package takes them from, which Nix fetches
  # only on Linux.
  skia-notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - run: |
          source=$(nix build --no-link --print-out-paths path:./nix#skia-source)
          cd "$source"
          find -L . -type f \( -iname 'license*' -o -iname 'copying*' -o -iname 'notice*' -o -iname 'ofl*' -o -iname ftl.txt \) -print0 \
            | tar --null --files-from - --dereference -czf "$GITHUB_WORKSPACE/skia-notices.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: skia-notices
          path: skia-notices.tar.gz
          if-no-files-found: error

  # Each on a Mac of its own processor, so every build script runs where it
  # builds for: Apple silicon and Intel.
  macos:
    needs: skia-notices
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # rsvg-convert draws the icon, NASM assembles x264's x86-64 code, and
      # scripts/set-version takes GNU sed.
      - run: brew install librsvg nasm gnu-sed
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH" scripts/set-version "${{ inputs.version }}"
      - uses: actions/download-artifact@v4
        with:
          name: skia-notices
          path: ${{ runner.temp }}
      - run: |
          mkdir "$RUNNER_TEMP/skia-source"
          tar -xzf "$RUNNER_TEMP/skia-notices.tar.gz" -C "$RUNNER_TEMP/skia-source"
          scripts/build-macos "$RUNNER_TEMP/skia-source" ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: target/dist/macos/Yapfast-*
          if-no-files-found: error
          compression-level: 0
